name: CobraFlux F8 temporary official container digest lookup
on:
  push:
    branches: [feat/production-foundation]
    paths: ['.github/workflows/phase8-image-digests.yml']
permissions:
  contents: read
jobs:
  read-only-digests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve official multi-platform manifest digests without pulling or deploying
        shell: bash
        run: |
          set -Eeuo pipefail
          for IMG in node:22-alpine postgres:16; do
            echo "IMAGE: $IMG"
            docker buildx imagetools inspect "$IMG" | head -n 8
          done
