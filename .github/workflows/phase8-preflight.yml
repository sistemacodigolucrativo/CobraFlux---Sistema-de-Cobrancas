name: CobraFlux F8 preflight and isolated restore drill
on:
  push:
    branches: [feat/production-foundation]
    paths:
      - 'scripts/phase8-readiness.mjs'
      - 'scripts/phase8-readiness.test.mjs'
      - 'server/production-config.ts'
      - 'server/production-config.test.ts'
      - 'scripts/phase8-secrets-audit.mjs'
      - 'scripts/phase8-secrets-audit.test.mjs'
      - 'docs/security/staging-config-inventory.json'
      - 'scripts/backup-db.sh'
      - 'scripts/restore-drill.sh'
      - '.github/workflows/phase8-preflight.yml'
  pull_request:
    paths:
      - 'scripts/phase8-readiness.mjs'
      - 'scripts/phase8-readiness.test.mjs'
      - 'server/production-config.ts'
      - 'server/production-config.test.ts'
      - 'scripts/phase8-secrets-audit.mjs'
      - 'scripts/phase8-secrets-audit.test.mjs'
      - 'docs/security/staging-config-inventory.json'
      - 'scripts/backup-db.sh'
      - 'scripts/restore-drill.sh'
      - '.github/workflows/phase8-preflight.yml'
  workflow_dispatch:
jobs:
  offline-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run offline readiness unit tests
        run: node --test scripts/phase8-readiness.test.mjs
      - name: Audit env inventory and guard against missing or browser-exposed secrets
        run: |
          node --test scripts/phase8-secrets-audit.test.mjs
          node scripts/phase8-secrets-audit.mjs --check
      - name: Read-only offline preflight (no credentials or external checks)
        run: node scripts/phase8-readiness.mjs --offline
  isolated-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cobraflux
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: cobraflux_restore_source
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cobraflux -d cobraflux_restore_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cobraflux:testpass@127.0.0.1:5432/cobraflux_restore_source
      RESTORE_DRILL_DATABASE_URL: postgresql://cobraflux:testpass@127.0.0.1:5432/cobraflux_restore_drill
      PGPASSWORD: testpass
      SESSION_SECRET: ci-only-f8-drill-not-for-any-real-application-12345
      NODE_ENV: test
      APP_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install application packages
        run: npm install --no-package-lock --no-audit
      - name: Migrate isolated source twice
        run: |
          npm run migrate
          npm run migrate
      - name: Backup and restore with matched PostgreSQL 16 client in disposable container
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network host \
            -e DATABASE_URL -e RESTORE_DRILL_DATABASE_URL -e PGPASSWORD \
            -v "$GITHUB_WORKSPACE/scripts:/work/scripts:ro" \
            postgres:16 bash -euo pipefail -s <<'PG_SCRIPT'
          SOURCE_COUNT="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc 'SELECT count(*) FROM schema_migrations')"
          test "$SOURCE_COUNT" -ge 21
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO organizations(id,name) VALUES('11111111-1111-4111-8111-111111111111','Synthetic isolated restore evidence')"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO clients(id,organization_id,name,phone,internal_code) VALUES('22222222-2222-4222-8222-222222222222','11111111-1111-4111-8111-111111111111','Synthetic fixture','+5511999990000','RESTORE-FIXTURE')"
          export BACKUP_DIR
          BACKUP_DIR="$(mktemp -d /tmp/cobraflux-f8-restore-XXXXXXXX)"
          trap 'rm -rf -- "$BACKUP_DIR"' EXIT
          bash /work/scripts/backup-db.sh
          BACKUP_FILE="$(find "$BACKUP_DIR" -maxdepth 1 -name '*.dump' -type f -print -quit)"
          test -n "$BACKUP_FILE"
          export BACKUP_FILE
          psql 'postgresql://cobraflux:testpass@127.0.0.1:5432/postgres' -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cobraflux_restore_drill'
          if RESTORE_DRILL_DATABASE_URL="$DATABASE_URL" bash /work/scripts/restore-drill.sh >/dev/null 2>&1; then
            echo "ERROR: restore guard allowed source database" >&2
            exit 1
          fi
          bash /work/scripts/restore-drill.sh
          RESTORED_COUNT="$(psql "$RESTORE_DRILL_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc 'SELECT count(*) FROM schema_migrations')"
          test "$RESTORED_COUNT" = "$SOURCE_COUNT"
          test "$(psql "$RESTORE_DRILL_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "SELECT count(*) FROM organizations WHERE id='11111111-1111-4111-8111-111111111111'")" = '1'
          test "$(psql "$RESTORE_DRILL_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "SELECT count(*) FROM clients WHERE id='22222222-2222-4222-8222-222222222222'")" = '1'
          if bash /work/scripts/restore-drill.sh >/dev/null 2>&1; then
            echo "ERROR: restore guard allowed a non-empty destination" >&2
            exit 1
          fi
          echo 'PASSED: isolated 21+ migrations, synthetic fixture and refusal guards.'
          echo 'LIMITATION: this does NOT validate encrypted offsite backups, PITR or real infrastructure.'
          PG_SCRIPT
