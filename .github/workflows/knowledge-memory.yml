name: CobraFlux AI memory integrity
on:
  push:
    branches:
      - feat/production-foundation
    paths:
      - 'docs/ai-memory/**'
      - 'AGENTS.md'
      - 'scripts/validate-project-memory.mjs'
      - '.github/workflows/knowledge-memory.yml'
  pull_request:
    paths:
      - 'docs/ai-memory/**'
      - 'AGENTS.md'
      - 'scripts/validate-project-memory.mjs'
      - '.github/workflows/knowledge-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate historical source checksums and memory structure
        run: node scripts/validate-project-memory.mjs
