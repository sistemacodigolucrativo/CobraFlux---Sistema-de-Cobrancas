name: CobraFlux production foundation checks
on:
  pull_request:
    paths:
      - 'server/**'
      - 'src/pages/production/**'
      - 'src/services/productionApi.ts'
      - 'src/App.tsx'
      - 'package.json'
      - '.github/workflows/production-foundation.yml'
  push:
    branches:
      - feat/production-foundation
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit
      - name: Typecheck
        run: npm run lint
      - name: Domain regression
        run: npm run test:domain
      - name: Security tests
        run: npm run test:server
      - name: Frontend build
        run: npm run build
