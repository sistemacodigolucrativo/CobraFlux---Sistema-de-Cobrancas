name: CobraFlux F8 locked dependencies and read-only CI policy
on:
  push:
    branches: [feat/production-foundation]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.github/workflows/**'
      - 'scripts/phase8-supply-chain.mjs'
      - 'scripts/phase8-supply-chain.test.mjs'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.github/workflows/**'
      - 'scripts/phase8-supply-chain.mjs'
      - 'scripts/phase8-supply-chain.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test lockfile and CI policy locally without network
        run: |
          node --test scripts/phase8-supply-chain.test.mjs
          node scripts/phase8-supply-chain.mjs --check
      - name: Verify a clean dependency installation from exact lockfile
        run: npm ci --no-audit --no-fund
      - name: Validate TypeScript with frozen dependencies
        run: npm run lint
      - name: Verify Docker image builds from exact npm lock (never publish)
        run: docker build --tag "cobraflux-f8-local-ci:${GITHUB_SHA}" .
