name: CobraFlux operational browser E2E
on:
  push:
    branches: [feat/production-foundation]
    paths:
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'src/pages/production/**'
      - 'src/services/productionApi.ts'
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/phase2-browser.yml'
  pull_request:
    paths:
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'src/pages/production/**'
      - 'src/services/productionApi.ts'
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/phase2-browser.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cobraflux
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: cobraflux_browser_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cobraflux -d cobraflux_browser_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      NODE_ENV: test
      DATABASE_URL: postgresql://cobraflux:testpass@127.0.0.1:5432/cobraflux_browser_test
      SESSION_SECRET: test-only-ci-secret-application-never-use-in-production
      APP_ORIGIN: http://127.0.0.1:8080
      PORT: '8080'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Apply PostgreSQL migrations
        run: npm run migrate
      - name: Build operational mode
        run: VITE_APP_MODE=production npm run build
      - name: Browser E2E — desktop and mobile
        run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: cobraflux-e2e-failures
          path: test-results/
          if-no-files-found: ignore
