name: Android CobraFlux - APK de testes
on:
  pull_request:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-cobraflux-demo.yml'
  push:
    branches:
      - android-webview-demo-debug
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-cobraflux-demo.yml'
  workflow_dispatch:
jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Gerar APK debug
        working-directory: mobile/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Publicar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: CobraFlux-Teste-Android9-MIUI10
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
