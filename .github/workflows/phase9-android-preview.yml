name: CobraFlux F9 Android debug preview (unconfigured, no production)
on:
  push:
    branches: [feat/production-foundation]
    paths:
      - 'mobile/android/**'
      - 'scripts/phase9-android-contract.mjs'
      - 'scripts/phase9-android-contract.test.mjs'
      - '.github/workflows/phase9-android-preview.yml'
  pull_request:
    paths:
      - 'mobile/android/**'
      - 'scripts/phase9-android-contract.mjs'
      - 'scripts/phase9-android-contract.test.mjs'
      - '.github/workflows/phase9-android-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COBRAFLUX_ANDROID_ORIGIN: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Guard Android origin, cleartext, WebView and debug-only build policy
        run: |
          node --test scripts/phase9-android-contract.test.mjs
          node scripts/phase9-android-contract.mjs --check
      - name: JUnit policy tests and debug APK (no release signing)
        working-directory: mobile/android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Publish short-lived debug APK (not Google Play)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobraflux-f9-android-debug-preview
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
